<!-- Place this HTML where you want the verse to appear -->
<div id="daily-verse-card" style="max-width: 500px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: sans-serif; background-color: #f8fafc;">
  <p id="verse-text" style="font-size: 1.1rem; line-height: 1.6; color: #1e293b; margin: 0 0 10px 0;">Loading daily verse...</p>
  <p id="verse-ref" style="font-weight: bold; color: #475569; margin: 0; text-align: right;"></p>
</div>

<script>
  async function loadDailyVerse() {
    try {
      const response = await fetch('https://beta.ourmanna.com/api/v1/get?format=json&order=daily');
      
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }

      const data = await response.json();
      const verseDetails = data.verse.details;

      // Update the page with the verse data
      document.getElementById('verse-text').textContent = `"${verseDetails.text}"`;
      document.getElementById('verse-ref').textContent = `- ${verseDetails.reference} (${verseDetails.version})`;
    } catch (error) {
      console.error('Error fetching the verse:', error);
      document.getElementById('verse-text').textContent = 'Unable to load today\'s verse. Please try again later.';
    }
  }

  // Fetch the verse as soon as the page loads
  document.addEventListener('DOMContentLoaded', loadDailyVerse);
</script>
